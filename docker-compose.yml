services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zeevan
      POSTGRES_USER: zeevan
      POSTGRES_PASSWORD: zeevan
    ports:
      - "5432:5432"
    volumes:
      - zeevan_postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeevan -d zeevan"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://zeevan:zeevan@db:5432/zeevan
      JWT_SECRET: local-docker-secret-change-me
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  zeevan_postgres_data:
